<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI UGC Video Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .container-card { max-width: 1200px; margin: auto; }
    .aspect-9-16 { aspect-ratio: 9 / 16; }
  </style>
</head>
<body class="min-h-screen bg-gray-50 p-4 md:p-8">

  <div id="app" class="container-card">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-gray-900 mb-2">
        <span class="text-blue-600">AI UGC</span> Video Generator
      </h1>
      <p class="text-lg text-gray-500">Buat aset video promosi 9:16 siap pakai untuk media sosial.</p>
    </header>

    <!-- Area Error -->
    <div id="error-message" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-6 hidden">
      <strong class="font-bold">Error:</strong>
      <span id="error-text"></span>
    </div>

    <!-- Indikator Langkah -->
    <div class="flex justify-center mb-8 space-x-4">
      <div id="step-1-indicator" class="px-4 py-2 rounded-full font-semibold bg-blue-600 text-white shadow-md">1. Input Produk</div>
      <div id="step-2-indicator" class="px-4 py-2 rounded-full font-semibold bg-gray-200 text-gray-600">2. Hasil & Refinement</div>
    </div>

    <!-- Langkah 1 -->
    <div id="step-1-content" class="bg-white p-6 md:p-10 rounded-2xl shadow-2xl">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Detail Produk & Suasana</h2>
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Produk</label>
          <input id="productName" type="text" placeholder="Masukkan nama produk"
                 class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Suasana</label>
          <select id="vibe" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500">
            <option>modern dan cerah</option>
            <option>hangat dan estetis</option>
            <option>minimalis dan bersih</option>
            <option>gelap dan misterius</option>
            <option>luar ruangan/alam</option>
          </select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="p-4 border border-dashed border-gray-300 rounded-xl bg-gray-50">
            <label class="block text-sm font-medium text-gray-700 mb-3">Upload Gambar Produk</label>
            <input type="file" id="productImageInput" accept="image/*"
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-blue-50 file:text-blue-700" />
            <img id="productImagePreview" class="mt-4 w-20 h-20 object-cover rounded-lg hidden" />
          </div>
          <div class="p-4 border border-dashed border-gray-300 rounded-xl bg-gray-50">
            <label class="block text-sm font-medium text-gray-700 mb-3">Upload Gambar Model</label>
            <input type="file" id="modelImageInput" accept="image/*"
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-blue-50 file:text-blue-700" />
            <img id="modelImagePreview" class="mt-4 w-20 h-20 object-cover rounded-lg hidden" />
          </div>
        </div>
      </div>

      <div class="mt-8">
        <button id="startButton" onclick="startGeneration()" disabled
                class="w-full py-4 rounded-xl font-bold text-lg bg-gray-300 text-gray-500 cursor-not-allowed">
          Generate Semua Aset Video
        </button>
      </div>
    </div>

    <!-- Langkah 2 -->
    <div id="step-2-content" class="space-y-8 hidden">
      <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Naskah dan Audio</h2>
        <div class="mb-6">
          <h3 class="text-xl font-semibold text-gray-700 mb-2">Naskah Iklan</h3>
          <div id="scriptOutput" class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-gray-700">Naskah akan muncul di sini.</div>
        </div>
        <div class="border-t pt-4 flex flex-col md:flex-row justify-between items-center">
          <h3 class="text-xl font-semibold text-gray-700">Audio Voice Over</h3>
          <div class="flex items-center space-x-3 mt-4 md:mt-0">
            <p id="audioStatus" class="text-gray-500">Belum dibuat</p>
            <audio id="audioPlayer" controls class="h-10 hidden"></audio>
          </div>
        </div>
      </div>
      <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Aset Adegan</h2>
        <div id="scenesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      </div>
      <div class="text-center">
        <button onclick="setStep(1)" class="text-blue-600 hover:text-blue-800 font-medium">&larr; Kembali ke Input</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      step: 1,
      productName: '',
      vibe: 'modern dan cerah',
      productImage: null,
      modelImage: null,
      script: '',
      audioBase64: null,
      scenes: [
        { id: 1, name: 'Hook', description: 'Menarik perhatian di awal.', status: 'pending' },
        { id: 2, name: 'Problem', description: 'Menunjukkan masalah pelanggan.', status: 'pending' },
        { id: 3, name: 'Solution', description: 'Menunjukkan solusi produk.', status: 'pending' },
        { id: 4, name: 'CTA', description: 'Ajakan untuk membeli.', status: 'pending' },
      ],
      loading: { all: false, script: false, audio: false, image: {} },
      error: null
    };

    const getEl = (id) => document.getElementById(id);

    function setStep(step) {
      state.step = step;
      updateUI();
    }

    function updateUI() {
      getEl('step-1-content').classList.toggle('hidden', state.step !== 1);
      getEl('step-2-content').classList.toggle('hidden', state.step !== 2);
      const startBtn = getEl('startButton');
      startBtn.disabled = !(state.productName && state.productImage && state.modelImage);
      startBtn.classList.toggle('bg-blue-600', !startBtn.disabled);
      startBtn.classList.toggle('text-white', !startBtn.disabled);
      startBtn.classList.toggle('cursor-pointer', !startBtn.disabled);
      startBtn.classList.toggle('bg-gray-300', startBtn.disabled);
      startBtn.classList.toggle('text-gray-500', startBtn.disabled);
    }

    async function callGeminiProxy(model, contents) {
      const res = await fetch('/api/gemini', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ model, contents })
      });
      if (!res.ok) throw new Error('Gagal generate script');
      const data = await res.json();
      return data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    async function callImagenProxy(prompt) {
      const res = await fetch('/api/imagen', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ prompt })
      });
      if (!res.ok) throw new Error('Gagal generate gambar');
      const data = await res.json();
      return data.bytesBase64Encoded;
    }

    async function callTtsProxy(text) {
      const res = await fetch('/api/tts', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text })
      });
      if (!res.ok) throw new Error('Gagal generate audio');
      const data = await res.json();
      return data.audioBase64;
    }

    function buildScriptPrompt() {
      return `Buat naskah iklan 4 bagian (Hook, Problem, Solution, CTA) untuk produk ${state.productName} dengan nuansa ${state.vibe}.`;
    }

    function splitScriptIntoParts(text) {
      return text.split(/\n+/).filter(t => t.trim());
    }

    function buildScenePrompt(scene, productName, vibe) {
      return `Adegan ${scene.name} untuk iklan ${productName}, gaya ${vibe}, tampilan vertikal 9:16.`;
    }

    function renderSceneCards() {
      const container = getEl('scenesContainer');
      container.innerHTML = '';
      for (const s of state.scenes) {
        const card = document.createElement('div');
        card.className = 'border rounded-xl p-4 text-center bg-gray-50 shadow';
        card.innerHTML = `
          <h3 class="font-bold mb-2">${s.name}</h3>
          <p class="text-sm text-gray-600 mb-3">${s.description}</p>
          ${s.imageBase64 ? `<img src="data:image/png;base64,${s.imageBase64}" class="rounded-xl shadow">`
          : `<p class="text-gray-400">${s.status}</p>`}
        `;
        container.appendChild(card);
      }
    }

    async function startGeneration() {
      try {
        state.loading.all = true;
        state.error = null;
        updateUI();

        // 1. Script
        state.loading.script = true;
        updateUI();
        const scriptText = await callGeminiProxy('gemini-2.0-flash-exp', [{ role: 'user', parts: [{ text: buildScriptPrompt() }] }]);
        state.script = splitScriptIntoParts(scriptText).join('\n');
        state.loading.script = false;
        updateUI();

        // 2. Gambar tiap adegan (sequential + delay aman)
        for (const scene of state.scenes) {
          await new Promise(r => setTimeout(r, 1500)); // delay aman
          const prompt = buildScenePrompt(scene, state.productName, state.vibe);
          const imageBase64 = await callImagenProxy(prompt);
          scene.imageBase64 = imageBase64;
          scene.status = 'done';
          renderSceneCards();
        }

        // 3. Audio
        state.loading.audio = true;
        updateUI();
        const audioBase64 = await callTtsProxy(state.script);
        state.audioBase64 = audioBase64;
        const audioBlob = new Blob([Uint8Array.from(atob(audioBase64), c => c.charCodeAt(0))], { type: 'audio/wav' });
        getEl('audioPlayer').src = URL.createObjectURL(audioBlob);
        getEl('audioPlayer').classList.remove('hidden');
        getEl('audioStatus').classList.add('hidden');
        state.loading.audio = false;

        setStep(2);
        updateUI();
      } catch (err) {
        state.error = err.message;
        getEl('error-message').classList.remove('hidden');
        getEl('error-text').textContent = err.message;
        updateUI();
      } finally {
        state.loading.all = false;
      }
    }

    document.getElementById('productName').addEventListener('input', e => {
      state.productName = e.target.value;
      updateUI();
    });
    document.getElementById('productImageInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        state.productImage = file;
        const img = getEl('productImagePreview');
        img.src = URL.createObjectURL(file);
        img.classList.remove('hidden');
      }
      updateUI();
    });
    document.getElementById('modelImageInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        state.modelImage = file;
        const img = getEl('modelImagePreview');
        img.src = URL.createObjectURL(file);
        img.classList.remove('hidden');
      }
      updateUI();
    });
  </script>
</body>
</html>
