<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Gemini Secure Proxy</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    button {
      display: inline-block;
      background: #007aff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background: #005cd8;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #333;
    }

    .loading {
      text-align: center;
      font-size: 16px;
      color: #007aff;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>💬 Gemini AI via Secure Proxy</h1>
    <p>Masukkan pertanyaanmu di bawah dan klik "Kirim ke Gemini".</p>

    <textarea id="userInput" placeholder="Tulis sesuatu..."></textarea>
    <button id="btnGenerate">Kirim ke Gemini</button>
    <div id="loading" class="loading" style="display:none;">Sedang memproses...</div>

    <div id="result" class="result"></div>
  </div>

  <script>
    const btnGenerate = document.getElementById("btnGenerate");
    const userInput = document.getElementById("userInput");
    const resultBox = document.getElementById("result");
    const loading = document.getElementById("loading");

    // Fungsi memanggil serverless proxy (Vercel)
    async function callGeminiProxy(model, text) {
      const response = await fetch("/api/gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model,
          contents: [
            {
              role: "user",
              parts: [{ text }]
            }
          ]
        })
      });

      if (!response.ok) {
        const msg = await response.text();
        throw new Error("Server error: " + msg);
      }

      return response.json();
    }

    btnGenerate.addEventListener("click", async () => {
      const text = userInput.value.trim();
      if (!text) {
        alert("Tulis pertanyaan terlebih dahulu.");
        return;
      }

      resultBox.textContent = "";
      loading.style.display = "block";
      btnGenerate.disabled = true;

      try {
        const data = await callGeminiProxy("gemini-2.0-flash-exp", text);

        // Parsing hasil sesuai struktur Gemini API
        const output = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Tidak ada respon.";
        resultBox.textContent = output;
      } catch (err) {
        console.error(err);
        resultBox.textContent = "Terjadi kesalahan: " + err.message;
      } finally {
        loading.style.display = "none";
        btnGenerate.disabled = false;
      }
    });
  </script>
</body>
</html>
